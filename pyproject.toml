[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-mts"
version = "0.1.0"
description = "A controlled study of attention for multivariate time-series classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aeon>=1.5,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
train = [
    "torch>=2.3,<3",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
